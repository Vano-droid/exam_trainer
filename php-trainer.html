const st={t:0,m:'pdo',v:0,mode:'copy',hints:new Set(),final:false,t0:0,t1:0};
const gen=()=>tasks[st.t].f(st.m).replace(/@(\w)@/g,(_,k)=>VAR[st.v][k]).split('\n').map(x=>x.trim()).filter(Boolean);
const ind=ls=>{let d=0;return ls.map(l=>{const x=Math.max(0,d-(/^[}\]]/.test(l)?1:0));d+=(l.match(/[{\[]/g)||[]).length-(l.match(/[}\]]/g)||[]).length;return x})};
const norm=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
let saved={};try{saved=JSON.parse(localStorage.getItem('phptr')||'{}')}catch(e){}
const key=()=>[st.t,st.m,st.mode].join('|');
const ta=$('#ta');
function render(){
 const t=gen(),d=ind(t),u=norm(ta.value);let ok=0;
 $('#ref').innerHTML=t.map((l,i)=>{
  let c='todo';
  if(i<u.length){if(u[i]===l){c='ok';ok++}else if(i==u.length-1&&!st.final&&l.startsWith(u[i]))c='cur';else c='bad'}
  const show=st.mode=='copy'||c=='ok'||st.final||st.hints.has(i);
  let body=show?esc(' '.repeat(4*d[i])+l):'▒'.repeat(Math.min(l.length,36));
  if(c=='bad'&&show&&st.final)body+=`<small>у вас: ${esc(u[i])}</small>`;
  if(st.final&&i>=u.length)c='bad',body+='<small>пропущено</small>';
  return `<div class="l ${c}"><i>${i+1}</i><span>${body}</span></div>`}).join('');
 const all=ok==t.length&&u.length==t.length;
 if(all&&!st.t1){st.t1=Date.now();const s=Math.round((st.t1-st.t0)/1000);if(!saved[key()]||s<saved[key()]){saved[key()]=s;try{localStorage.setItem('phptr',JSON.stringify(saved))}catch(e){}}tabs()}
 st.ok=ok;st.n=t.length;st.ex=u.length>t.length;stat(all);
}
function stat(all){
 const s=st.t0?Math.round(((st.t1||Date.now())-st.t0)/1000):0;
 $('#stat').innerHTML=`Строк верно: <b>${st.ok}/${st.n}</b> · подсказок: <b>${st.hints.size}</b> · время: <b>${s} с</b>`+(st.ex?' · <span style="color:var(--bad)">лишние строки</span>':'')+(all?' · <span class="done">✓ Готово! Повторите без подсказок и в режиме «По памяти».</span>':'');
}
function tabs(){
 $('#tasks').innerHTML=tasks.map((x,i)=>`<button data-i="${i}" class="${i==st.t?'on':''}">${saved[[i,st.m,st.mode].join('|')]?'✓ ':''}${esc(x.n)}</button>`).join('');
 document.querySelectorAll('#gm button').forEach(b=>b.classList.toggle('on',b.dataset.k==st.m));
 document.querySelectorAll('#gmode button').forEach(b=>b.classList.toggle('on',b.dataset.k==st.mode));
}
function reset(){ta.value='';st.hints=new Set();st.final=false;st.t0=0;st.t1=0;tabs();render()}
$('#tasks').onclick=e=>{const b=e.target.closest('button');if(b){st.t=+b.dataset.i;reset()}};
$('#gm').onclick=e=>{const b=e.target.closest('button');if(b){st.m=b.dataset.k;reset()}};
$('#gmode').onclick=e=>{const b=e.target.closest('button');if(b){st.mode=b.dataset.k;reset()}};
$('#gv').onchange=e=>{st.v=+e.target.value;reset()};
$('#rst').onclick=reset;
$('#chk').onclick=()=>{st.final=true;render()};
$('#hint').onclick=()=>{st.hints.add(norm(ta.value).length);render();ta.focus()};
ta.oninput=()=>{if(!st.t0)st.t0=Date.now();st.final=false;render()};
ta.onpaste=e=>e.preventDefault();
ta.onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
setInterval(()=>{if(st.t0&&!st.t1)stat(false)},1000);
reset();
</script></body></html>
