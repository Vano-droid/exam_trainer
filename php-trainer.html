<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр PHP: Конференции (минимум)</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2230;--card:#fff;--bd:#d3d8e2;--mut:#667085;--ok:#176b34;--okb:#e0f4e6;--bad:#a8231b;--badb:#fde7e5;--cur:#7a5400;--curb:#fff3d1;--ac:#2f5bea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e6e9f0;--card:#1b2029;--bd:#2f3745;--mut:#9aa4b5;--ok:#7be0a0;--okb:#14301f;--bad:#ff9b94;--badb:#3a1a18;--cur:#ffd36e;--curb:#3a2f10;--ac:#7c9bff}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e6e9f0;--card:#1b2029;--bd:#2f3745;--mut:#9aa4b5;--ok:#7be0a0;--okb:#14301f;--bad:#ff9b94;--badb:#3a1a18;--cur:#ffd36e;--curb:#3a2f10;--ac:#7c9bff}
html,body{height:auto;margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
button,select{font:inherit;padding:6px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grp{display:flex;gap:0}.grp button{border-radius:0}.grp button:first-child{border-radius:8px 0 0 8px}.grp button:last-child{border-radius:0 8px 8px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:0}
.box h2{font-size:13px;color:var(--mut);margin:2px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.code{max-height:70vh;overflow:auto}
.l{display:flex;gap:8px;padding:1px 6px;border-radius:5px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre}
.l i{color:var(--mut);min-width:22px;text-align:right;font-style:normal}
.l.ok{background:var(--okb);color:var(--ok)}.l.bad{background:var(--badb);color:var(--bad)}.l.cur{background:var(--curb);color:var(--cur)}
.l small{color:var(--bad);margin-left:12px}
textarea{width:100%;height:70vh;box-sizing:border-box;border:0;outline:0;resize:vertical;background:transparent;color:var(--fg);font:13px/1.5 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}
.stat{margin-top:10px;color:var(--mut)}.stat b{color:var(--fg)}.done{color:var(--ok);font-weight:700}
.vars{margin:8px 0 0;color:var(--mut);font-size:13px}
</style></head><body><main>
<h1>Тренажёр: PHP-минимум «Конференции»</h1>
<p class="sub">Только строки, которые спрашивают на экзамене: подключение, сессия, регистрация, вход, CRUD, вывод в HTML, JSON. Отступы и пустые строки не учитываются, остальное — символ в символ. Вставка запрещена.</p>

<div class="bar" id="tasks"></div>

<div class="bar">
  <div class="grp" id="gm"><button data-k="pdo">PDO</button><button data-k="mysqli">mysqli</button></div>
  <div class="grp" id="gmode"><button data-k="copy">Переписывание</button><button data-k="mem">По памяти</button></div>
  <select id="gv">
    <option value="0">Данные как в КИМ</option>
    <option value="1">Другие данные №1</option>
    <option value="2">Другие данные №2</option>
  </select>
  <button id="hint">Подсказка</button><button id="chk">Проверить</button><button id="rst">Сначала</button>
</div>

<div class="cols">
  <div class="box"><h2>Эталон</h2><div class="code" id="ref"></div></div>
  <div class="box"><h2>Ваш код</h2><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Начните печатать…"></textarea></div>
</div>
<div class="stat" id="stat"></div>
<p class="vars" id="vars"></p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// варианты данных: таблица, помещение, дата, оплата, статус, отзыв, финальный статус
const VAR = [
  {T:'requests',    R:'room',  D:'start_at', P:'payment', S:'status', V:'review',   X:'Завершено'},
  {T:'bookings',    R:'hall',  D:'event_at', P:'pay_type',S:'state',  V:'comment',  X:'Выполнено'},
  {T:'applications',R:'place', D:'begin_at', P:'pay_way', S:'phase',  V:'feedback', X:'Закрыта'}
];

const tasks = [
{
  n: 'db.php',
  pdo: String.raw`$pdo = new PDO('mysql:host=localhost;dbname=conference;charset=utf8mb4', 'root', '');
$pdo->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE, PDO::FETCH_ASSOC);`,
  mysqli: String.raw`$db = new mysqli('localhost', 'root', '', 'conference');
$db->set_charset('utf8mb4');`
},
{
  n: 'init.php',
  pdo: String.raw`session_start();
$statuses = ['Новая', 'Назначено', '@X@'];
$payments = ['Наличными', 'Переводом'];
function e($v) { return htmlspecialchars((string) $v, ENT_QUOTES, 'UTF-8'); }
function redirect($url) { header('Location: ' . $url); exit; }
function require_login() { if (empty($_SESSION['user'])) redirect('login.php'); }
function require_admin() { require_login(); if ($_SESSION['user']['role'] !== 'admin') exit('Доступ запрещён'); }`,
  mysqli: String.raw`session_start();
$statuses = ['Новая', 'Назначено', '@X@'];
$payments = ['Наличными', 'Переводом'];
function e($v) { return htmlspecialchars((string) $v, ENT_QUOTES, 'UTF-8'); }
function redirect($url) { header('Location: ' . $url); exit; }
function require_login() { if (empty($_SESSION['user'])) redirect('login.php'); }
function require_admin() { require_login(); if ($_SESSION['user']['role'] !== 'admin') exit('Доступ запрещён'); }`
},
{
  n: 'register.php',
  pdo: String.raw`$errors = [];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$login = trim($_POST['login']);
$password = $_POST['password'];
if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин: 6+ латинских символов';
if (mb_strlen($password) < 8) $errors[] = 'Пароль: от 8 символов';
if (!$errors) {
$stmt = $pdo->prepare('SELECT id FROM users WHERE login = ?');
$stmt->execute([$login]);
if ($stmt->fetch()) $errors[] = 'Логин занят';
}
if (!$errors) {
$stmt = $pdo->prepare('INSERT INTO users (login, password) VALUES (?, ?)');
$stmt->execute([$login, password_hash($password, PASSWORD_DEFAULT)]);
redirect('login.php');
}
}`,
  mysqli: String.raw`$errors = [];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$login = trim($_POST['login']);
$password = $_POST['password'];
if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин: 6+ латинских символов';
if (mb_strlen($password) < 8) $errors[] = 'Пароль: от 8 символов';
if (!$errors) {
$stmt = $db->prepare('SELECT id FROM users WHERE login = ?');
$stmt->bind_param('s', $login);
$stmt->execute();
if ($stmt->get_result()->fetch_assoc()) $errors[] = 'Логин занят';
}
if (!$errors) {
$hash = password_hash($password, PASSWORD_DEFAULT);
$stmt = $db->prepare('INSERT INTO users (login, password) VALUES (?, ?)');
$stmt->bind_param('ss', $login, $hash);
$stmt->execute();
redirect('login.php');
}
}`
},
{
  n: 'login.php',
  pdo: String.raw`$errors = [];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$login = trim($_POST['login']);
$password = $_POST['password'];
$stmt = $pdo->prepare('SELECT * FROM users WHERE login = ?');
$stmt->execute([$login]);
$user = $stmt->fetch();
if ($user && password_verify($password, $user['password'])) {
$_SESSION['user'] = $user;
redirect('requests.php');
}
$errors[] = 'Неверный логин или пароль';
}`,
  mysqli: String.raw`$errors = [];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$login = trim($_POST['login']);
$password = $_POST['password'];
$stmt = $db->prepare('SELECT * FROM users WHERE login = ?');
$stmt->bind_param('s', $login);
$stmt->execute();
$user = $stmt->get_result()->fetch_assoc();
if ($user && password_verify($password, $user['password'])) {
$_SESSION['user'] = $user;
redirect('requests.php');
}
$errors[] = 'Неверный логин или пароль';
}`
},
{
  n: 'request.php (сохранить)',
  pdo: String.raw`require_login();
$uid = $_SESSION['user']['id'];
$id = (int) ($_GET['id'] ?? 0);
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$room = trim($_POST['room']);
$date = $_POST['date'];
$payment = $_POST['payment'];
if ($id) {
$stmt = $pdo->prepare('UPDATE @T@ SET @R@ = ?, @D@ = ?, @P@ = ? WHERE id = ? AND user_id = ?');
$stmt->execute([$room, $date, $payment, $id, $uid]);
} else {
$stmt = $pdo->prepare('INSERT INTO @T@ (user_id, @R@, @D@, @P@) VALUES (?, ?, ?, ?)');
$stmt->execute([$uid, $room, $date, $payment]);
}
redirect('requests.php');
}`,
  mysqli: String.raw`require_login();
$uid = $_SESSION['user']['id'];
$id = (int) ($_GET['id'] ?? 0);
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$room = trim($_POST['room']);
$date = $_POST['date'];
$payment = $_POST['payment'];
if ($id) {
$stmt = $db->prepare('UPDATE @T@ SET @R@ = ?, @D@ = ?, @P@ = ? WHERE id = ? AND user_id = ?');
$stmt->bind_param('sssii', $room, $date, $payment, $id, $uid);
$stmt->execute();
} else {
$stmt = $db->prepare('INSERT INTO @T@ (user_id, @R@, @D@, @P@) VALUES (?, ?, ?, ?)');
$stmt->bind_param('isss', $uid, $room, $date, $payment);
$stmt->execute();
}
redirect('requests.php');
}`
},
{
  n: 'requests.php (список)',
  pdo: String.raw`require_login();
$uid = $_SESSION['user']['id'];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$id = (int) $_POST['id'];
$stmt = $pdo->prepare('DELETE FROM @T@ WHERE id = ? AND user_id = ?');
$stmt->execute([$id, $uid]);
redirect('requests.php');
}
$stmt = $pdo->prepare('SELECT * FROM @T@ WHERE user_id = ? ORDER BY id DESC');
$stmt->execute([$uid]);
$requests = $stmt->fetchAll();`,
  mysqli: String.raw`require_login();
$uid = $_SESSION['user']['id'];
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$id = (int) $_POST['id'];
$stmt = $db->prepare('DELETE FROM @T@ WHERE id = ? AND user_id = ?');
$stmt->bind_param('ii', $id, $uid);
$stmt->execute();
redirect('requests.php');
}
$stmt = $db->prepare('SELECT * FROM @T@ WHERE user_id = ? ORDER BY id DESC');
$stmt->bind_param('i', $uid);
$stmt->execute();
$requests = $stmt->get_result()->fetch_all(MYSQLI_ASSOC);`
},
{
  n: 'review.php (отзыв)',
  pdo: String.raw`require_login();
$uid = $_SESSION['user']['id'];
$id = (int) $_POST['id'];
$review = trim($_POST['review']);
$errors = [];
if ($review === '') $errors[] = 'Напишите отзыв';
if (!$errors) {
$stmt = $pdo->prepare('UPDATE @T@ SET @V@ = ? WHERE id = ? AND user_id = ?');
$stmt->execute([$review, $id, $uid]);
}`,
  mysqli: String.raw`require_login();
$uid = $_SESSION['user']['id'];
$id = (int) $_POST['id'];
$review = trim($_POST['review']);
$errors = [];
if ($review === '') $errors[] = 'Напишите отзыв';
if (!$errors) {
$stmt = $db->prepare('UPDATE @T@ SET @V@ = ? WHERE id = ? AND user_id = ?');
$stmt->bind_param('sii', $review, $id, $uid);
$stmt->execute();
}`
},
{
  n: 'admin.php',
  pdo: String.raw`require_admin();
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$status = $_POST['status'];
$id = (int) $_POST['id'];
$stmt = $pdo->prepare('UPDATE @T@ SET @S@ = ? WHERE id = ?');
$stmt->execute([$status, $id]);
redirect('admin.php');
}
$sql = 'SELECT @T@.*, users.fullname FROM @T@ JOIN users ON users.id = @T@.user_id ORDER BY @T@.id DESC';
$stmt = $pdo->query($sql);
$requests = $stmt->fetchAll();`,
  mysqli: String.raw`require_admin();
if ($_SERVER['REQUEST_METHOD'] === 'POST') {
$status = $_POST['status'];
$id = (int) $_POST['id'];
$stmt = $db->prepare('UPDATE @T@ SET @S@ = ? WHERE id = ?');
$stmt->bind_param('si', $status, $id);
$stmt->execute();
redirect('admin.php');
}
$sql = 'SELECT @T@.*, users.fullname FROM @T@ JOIN users ON users.id = @T@.user_id ORDER BY @T@.id DESC';
$requests = $db->query($sql)->fetch_all(MYSQLI_ASSOC);`
},
{
  n: 'вывод в HTML',
  pdo: String.raw`<?php foreach ($requests as $row): ?>
<tr>
<td><?= e($row['id']) ?></td>
<td><?= e($row['@R@']) ?></td>
<td><?= e($row['@D@']) ?></td>
<td><?= e($row['@S@']) ?></td>
</tr>
<?php endforeach; ?>`,
  mysqli: String.raw`<?php foreach ($requests as $row): ?>
<tr>
<td><?= e($row['id']) ?></td>
<td><?= e($row['@R@']) ?></td>
<td><?= e($row['@D@']) ?></td>
<td><?= e($row['@S@']) ?></td>
</tr>
<?php endforeach; ?>`
},
{
  n: 'проверки (регулярки)',
  pdo: String.raw`if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин';
if (!preg_match('/^[А-Яа-яЁё ]+$/u', $fullname)) $errors[] = 'ФИО';
if (!preg_match('/^8\([0-9]{3}\)[0-9]{3}-[0-9]{2}-[0-9]{2}$/', $phone)) $errors[] = 'Телефон';
if (!filter_var($email, FILTER_VALIDATE_EMAIL)) $errors[] = 'E-mail';
if (mb_strlen($password) < 8) $errors[] = 'Пароль';`,
  mysqli: String.raw`if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин';
if (!preg_match('/^[А-Яа-яЁё ]+$/u', $fullname)) $errors[] = 'ФИО';
if (!preg_match('/^8\([0-9]{3}\)[0-9]{3}-[0-9]{2}-[0-9]{2}$/', $phone)) $errors[] = 'Телефон';
if (!filter_var($email, FILTER_VALIDATE_EMAIL)) $errors[] = 'E-mail';
if (mb_strlen($password) < 8) $errors[] = 'Пароль';`
},
{
  n: 'JSON-ответ API',
  pdo: String.raw`header('Content-Type: application/json; charset=utf-8');
$stmt = $pdo->query('SELECT * FROM @T@');
echo json_encode($stmt->fetchAll(), JSON_UNESCAPED_UNICODE);`,
  mysqli: String.raw`header('Content-Type: application/json; charset=utf-8');
$result = $db->query('SELECT * FROM @T@');
echo json_encode($result->fetch_all(MYSQLI_ASSOC), JSON_UNESCAPED_UNICODE);`
}
];

const ta = $('#ta'), refEl = $('#ref'), statEl = $('#stat');
const st = {t:0, m:'pdo', v:0, mode:'copy', hints:new Set(), final:false, t0:0, t1:0, ok:0, n:0};

// эталон: подставить данные варианта и убрать пустые строки
function gen(){
  return tasks[st.t][st.m]
    .replace(/@(\w)@/g, (_, k) => VAR[st.v][k])
    .split('\n').map(l => l.trim()).filter(Boolean);
}
function typed(){
  return ta.value.split('\n').map(l => l.trim()).filter(Boolean);
}
// отступы для показа (сравнение их не учитывает)
function indents(lines){
  let d = 0;
  return lines.map(l => {
    const before = Math.max(0, d - (/^[}\]]/.test(l) ? 1 : 0));
    d += (l.match(/[{\[]/g) || []).length - (l.match(/[}\]]/g) || []).length;
    return before;
  });
}

let best = {};
try { best = JSON.parse(localStorage.getItem('php-trainer') || '{}'); } catch (e) {}
const key = () => [st.t, st.m, st.mode].join('|');

function render(){
  const ref = gen(), pad = indents(ref), mine = typed();
  let ok = 0;

  refEl.innerHTML = ref.map((line, i) => {
    let cls = '';
    if (i < mine.length) {
      if (mine[i] === line) { cls = 'ok'; ok++; }
      else if (i === mine.length - 1 && !st.final && line.startsWith(mine[i])) cls = 'cur';
      else cls = 'bad';
    }
    const shown = st.mode === 'copy' || cls === 'ok' || st.final || st.hints.has(i);
    let text = shown ? esc('    '.repeat(pad[i]) + line) : '░'.repeat(Math.min(line.length, 36));
    if (cls === 'bad' && st.final) text += `<small>у вас: ${esc(mine[i] || '—')}</small>`;
    if (st.final && i >= mine.length) { cls = 'bad'; text += '<small>пропущено</small>'; }
    return `<div class="l ${cls}"><i>${i + 1}</i><span>${text}</span></div>`;
  }).join('');

  const done = ok === ref.length && mine.length === ref.length;
  if (done && !st.t1) {
    st.t1 = Date.now();
    const sec = Math.round((st.t1 - st.t0) / 1000);
    if (!best[key()] || sec < best[key()]) {
      best[key()] = sec;
      try { localStorage.setItem('php-trainer', JSON.stringify(best)); } catch (e) {}
    }
    tabs();
  }
  st.ok = ok; st.n = ref.length;
  stat(done);
}

function stat(done){
  const sec = st.t0 ? Math.round(((st.t1 || Date.now()) - st.t0) / 1000) : 0;
  const extra = typed().length > st.n ? ' · <span style="color:var(--bad)">лишние строки</span>' : '';
  const fast = best[key()] ? ` · рекорд: ${best[key()]} с` : '';
  statEl.innerHTML = `Строк верно: <b>${st.ok}/${st.n}</b> · подсказок: <b>${st.hints.size}</b> · время: <b>${sec} с</b>${fast}${extra}`
    + (done ? ' · <span class="done">✓ Готово. Повторите в режиме «По памяти».</span>' : '');
}

function tabs(){
  $('#tasks').innerHTML = tasks.map((t, i) =>
    `<button data-i="${i}" class="${i === st.t ? 'on' : ''}">${best[[i, st.m, st.mode].join('|')] ? '✓ ' : ''}${esc(t.n)}</button>`
  ).join('');
  document.querySelectorAll('#gm button').forEach(b => b.classList.toggle('on', b.dataset.k === st.m));
  document.querySelectorAll('#gmode button').forEach(b => b.classList.toggle('on', b.dataset.k === st.mode));
  $('#vars').textContent = `Вариант: ${VAR[st.v].T} · помещение — ${VAR[st.v].R} · дата — ${VAR[st.v].D} · оплата — ${VAR[st.v].P} · статус — ${VAR[st.v].S} · отзыв — ${VAR[st.v].V} · финальный — ${VAR[st.v].X}`;
}

function reset(){
  ta.value = '';
  st.hints = new Set();
  st.final = false; st.t0 = 0; st.t1 = 0;
  tabs(); render();
}

$('#tasks').onclick = e => { const b = e.target.closest('button'); if (b) { st.t = +b.dataset.i; reset(); } };
$('#gm').onclick = e => { const b = e.target.closest('button'); if (b) { st.m = b.dataset.k; reset(); } };
$('#gmode').onclick = e => { const b = e.target.closest('button'); if (b) { st.mode = b.dataset.k; reset(); } };
$('#gv').onchange = e => { st.v = +e.target.value; reset(); };
$('#rst').onclick = reset;
$('#chk').onclick = () => { st.final = true; render(); };
$('#hint').onclick = () => { st.hints.add(typed().length); render(); ta.focus(); };

ta.oninput = () => { if (!st.t0) st.t0 = Date.now(); st.final = false; render(); };
ta.onpaste = e => e.preventDefault();
ta.onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); } };
setInterval(() => { if (st.t0 && !st.t1) stat(false); }, 1000);

reset();
</script></body></html>
