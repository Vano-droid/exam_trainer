<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHP к экзамену: уроки</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2230;--card:#fff;--bd:#d3d8e2;--mut:#667085;--ok:#176b34;--okb:#e0f4e6;--bad:#a8231b;--badb:#fde7e5;--ac:#2f5bea}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9f0;--card:#1b2029;--bd:#2f3745;--mut:#9aa4b5;--ok:#7be0a0;--okb:#14301f;--bad:#ff9b94;--badb:#3a1a18;--ac:#7c9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
select,button,input{font:inherit;padding:10px 12px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
select{width:100%;margin-bottom:8px}
.tabs,.row{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 2px;font-size:14px}.row button{flex:1}
button.on,button.main{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
code,.l{font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.l{padding:3px 8px;border-radius:6px;background:var(--okb);color:var(--ok);margin-bottom:3px}
.l.cur{background:var(--bg);color:var(--fg);border:1px dashed var(--ac)}
.x{color:var(--mut);font-size:14px;margin:2px 0 8px}
.ln code{display:block;padding:3px 8px;background:var(--card);border-radius:6px}
.act{position:sticky;bottom:0;background:var(--bg);padding:6px 0}
input{width:100%;font-family:ui-monospace,Consolas,monospace}
input.bad{border-color:var(--bad);background:var(--badb)}
.sym{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.sym button{min-width:40px;min-height:38px;padding:4px 8px;font-family:ui-monospace,monospace}
.done{color:var(--ok);font-weight:700}
</style></head><body><main>
<h1>PHP к экзамену: уроки</h1>
<select id="ls"></select>
<select id="gv"><option value="0">Данные как в КИМ</option><option value="1">Другие данные №1</option><option value="2">Другие данные №2</option></select>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
const $ = s => document.querySelector(s), r = String.raw;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VAR = [
  {T:'requests', R:'room', D:'start_at', P:'payment', S:'status', V:'review'},
  {T:'bookings', R:'hall', D:'event_at', P:'pay_type', S:'state', V:'comment'},
  {T:'applications', R:'place', D:'begin_at', P:'pay_way', S:'phase', V:'feedback'}
];
// строка: [код, что пропускаем на этапе 2, объяснение]
const LS = [
{c:'Основы', n:'1. db.php: подключение', L:[
 [`$pdo = new PDO('mysql:host=localhost;dbname=conference;charset=utf8mb4', 'root', '');`,`mysql:host=localhost`,`Подключение: драйвер, сервер, имя БД, кодировка, логин и пароль (в Laragon пароль пустой).`],
 [`$pdo->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE, PDO::FETCH_ASSOC);`,`FETCH_ASSOC`,`Строки приходят как ['поле' => значение]. Без этого json_encode продублирует поля по номерам.`]]},
{c:'Основы', n:'2. init.php: сессия и функции', L:[
 [`session_start();`,`session_start`,`Включает сессию. Всегда в начале, до любого вывода.`],
 [`function e($v) { return htmlspecialchars($v); }`,`htmlspecialchars`,`Экранирует < > & и кавычки, чтобы пользователь не вставил свой HTML. Оборачиваем каждый вывод.`],
 [`function redirect($url) { header('Location: ' . $url); exit; }`,`header('Location: ' . $url)`,`Переход на другую страницу. exit обязателен, иначе код ниже продолжит работать.`],
 [`function require_login() { if (empty($_SESSION['user'])) redirect('login.php'); }`,`empty($_SESSION['user'])`,`Нет пользователя в сессии, значит, на страницу входа.`],
 [`function require_admin() { require_login(); if ($_SESSION['user']['role'] !== 'admin') exit('Доступ запрещён'); }`,`!== 'admin'`,`Сначала проверка входа, потом роли.`]]},
{c:'Основы', n:'3. register.php: регистрация', L:[
 [`$errors = [];`,`[]`,`Массив для сообщений об ошибках.`],
 [`if ($_SERVER['REQUEST_METHOD'] === 'POST') {`,`'POST'`,`Код работает только когда форму отправили.`],
 [`$login = trim($_POST['login']);`,`trim`,`trim убирает пробелы по краям.`],
 [`$password = $_POST['password'];`,`$_POST['password']`,`Пароль не trim-им: пробелы могут быть частью пароля.`],
 [`if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин: 6+ латинских символов';`,`preg_match`,`Не подошло под регулярку, добавляем ошибку. Разбор регулярок в отдельном разделе.`],
 [`if (mb_strlen($password) < 8) $errors[] = 'Пароль: от 8 символов';`,`mb_strlen`,`mb_strlen считает символы, а не байты.`],
 [`if (!$errors) {`,`!$errors`,`Пустой массив значит, что ошибок нет.`],
 [`$stmt = $pdo->prepare('SELECT id FROM users WHERE login = ?');`,`prepare`,`Запрос с ? вместо значения: защита от SQL-инъекций.`],
 [`$stmt->execute([$login]);`,`execute`,`Подставляем значения вместо ? по порядку.`],
 [`if ($stmt->fetch()) $errors[] = 'Логин занят';`,`fetch()`,`Нашлась строка, значит, такой логин уже есть.`],
 [`}`],
 [`if (!$errors) {`,`!$errors`,`Снова проверяем: ошибок по-прежнему нет?`],
 [`$stmt = $pdo->prepare('INSERT INTO users (login, password) VALUES (?, ?)');`,`INSERT INTO users`,`Добавляем пользователя: два поля и два ?.`],
 [`$stmt->execute([$login, password_hash($password, PASSWORD_DEFAULT)]);`,`password_hash`,`Пароль храним только в виде хеша.`],
 [`redirect('login.php');`,`login.php`,`После регистрации идём на вход.`],
 [`}`],[`}`]]},
{c:'Основы', n:'4. login.php: вход', L:[
 [`$errors = [];`],
 [`if ($_SERVER['REQUEST_METHOD'] === 'POST') {`],
 [`$login = $_POST['login'];`,`$_POST`,`Данные формы лежат в $_POST по атрибуту name.`],
 [`$password = $_POST['password'];`],
 [`$stmt = $pdo->prepare('SELECT * FROM users WHERE login = ?');`,`SELECT *`,`Нужна вся строка: и хеш пароля, и роль.`],
 [`$stmt->execute([$login]);`],
 [`$user = $stmt->fetch();`,`fetch`,`Одна строка или false, если логина нет.`],
 [`if ($user && password_verify($password, $user['password'])) {`,`password_verify`,`Сверяем введённый пароль с хешем из базы.`],
 [`$_SESSION['user'] = $user;`,`$_SESSION['user']`,`Запоминаем пользователя в сессии: так сайт знает, что он вошёл.`],
 [`redirect('requests.php');`],
 [`}`],
 [`$errors[] = 'Неверный логин или пароль';`,`Неверный логин или пароль`,`Одно общее сообщение, чтобы не подсказывать, что именно не так.`],
 [`}`]]},
{c:'Основы', n:'5. request.php: добавить и изменить', L:[
 [`require_login();`,`require_login`,`Только для вошедших.`],
 [`$uid = $_SESSION['user']['id'];`,`['id']`,`id берём из сессии, а не из формы: подделать нельзя.`],
 [`$id = (int) ($_GET['id'] ?? 0);`,`?? 0`,`id из адреса. Нет id, будет 0, значит, создаём новую запись.`],
 [`if ($_SERVER['REQUEST_METHOD'] === 'POST') {`],
 [`if ($id) {`,`$id`,`id есть: редактируем. Нет: добавляем.`],
 [`$stmt = $pdo->prepare('UPDATE @T@ SET @R@ = ?, @D@ = ?, @P@ = ? WHERE id = ? AND user_id = ?');`,`AND user_id = ?`,`UPDATE меняет поля. user_id в WHERE не даёт править чужое.`],
 [`$stmt->execute([$_POST['room'], $_POST['date'], $_POST['payment'], $id, $uid]);`,`$id, $uid`,`Порядок значений равен порядку знаков ? в запросе.`],
 [`} else {`],
 [`$stmt = $pdo->prepare('INSERT INTO @T@ (user_id, @R@, @D@, @P@) VALUES (?, ?, ?, ?)');`,`INSERT INTO @T@`,`Сколько полей в скобках, столько и ?.`],
 [`$stmt->execute([$uid, $_POST['room'], $_POST['date'], $_POST['payment']]);`],
 [`}`],
 [`redirect('requests.php');`],
 [`}`]]},
{c:'Основы', n:'6. requests.php: список и удаление', L:[
 [`require_login();`],
 [`$uid = $_SESSION['user']['id'];`],
 [`if ($_SERVER['REQUEST_METHOD'] === 'POST') {`],
 [`$stmt = $pdo->prepare('DELETE FROM @T@ WHERE id = ? AND user_id = ?');`,`DELETE FROM`,`Удаляем только свою запись.`],
 [`$stmt->execute([$_POST['id'], $uid]);`],
 [`redirect('requests.php');`],
 [`}`],
 [`$stmt = $pdo->prepare('SELECT * FROM @T@ WHERE user_id = ?');`,`WHERE user_id = ?`,`В списке только записи текущего пользователя.`],
 [`$stmt->execute([$uid]);`],
 [`$requests = $stmt->fetchAll();`,`fetchAll`,`fetchAll даёт все строки массивом, fetch только одну.`]]},
{c:'Основы', n:'7. review.php: отзыв', L:[
 [`require_login();`],
 [`$stmt = $pdo->prepare('UPDATE @T@ SET @V@ = ? WHERE id = ? AND user_id = ?');`,`SET @V@ = ?`,`Записываем отзыв в одно поле.`],
 [`$stmt->execute([trim($_POST['review']), $_POST['id'], $_SESSION['user']['id']]);`,`trim($_POST['review'])`,`Порядок как у ?: отзыв, id записи, id владельца.`]]},
{c:'Основы', n:'8. admin.php: статусы', L:[
 [`require_admin();`,`require_admin`,`Только для админа.`],
 [`if ($_SERVER['REQUEST_METHOD'] === 'POST') {`],
 [`$stmt = $pdo->prepare('UPDATE @T@ SET @S@ = ? WHERE id = ?');`,`SET @S@ = ?`,`Админ меняет любую запись, поэтому user_id в WHERE не нужен.`],
 [`$stmt->execute([$_POST['status'], $_POST['id']]);`],
 [`redirect('admin.php');`],
 [`}`],
 [`$requests = $pdo->query('SELECT @T@.*, users.fullname FROM @T@ JOIN users ON users.id = @T@.user_id')->fetchAll();`,`JOIN users ON users.id = @T@.user_id`,`JOIN подтягивает данные пользователя к записи. query() используем, когда в запросе нет ?.`]]},
{c:'Основы', n:'9. Вывод в HTML', L:[
 [`<?php foreach ($requests as $row): ?>`,`foreach`,`Цикл по строкам прямо в HTML.`],
 [`<tr>`],
 [`<td><?= e($row['@R@']) ?></td>`,`<?= e(`,`<?= это короткий echo. Всегда оборачиваем в e().`],
 [`<td><?= e($row['@S@']) ?></td>`],
 [`</tr>`],
 [`<?php endforeach; ?>`,`endforeach`,`Закрываем цикл.`]]},
{c:'Основы', n:'10. JSON-ответ', L:[
 [`header('Content-Type: application/json; charset=utf-8');`,`application/json`,`Говорим браузеру, что отдаём JSON.`],
 [`echo json_encode($pdo->query('SELECT * FROM @T@')->fetchAll(), JSON_UNESCAPED_UNICODE);`,`JSON_UNESCAPED_UNICODE`,`Без флага русский текст превратится в коды.`]]},
{c:'Регулярки и проверки', n:'11. Регулярки', info:'Шпаргалка: ^ начало строки, $ конец, [abc] один символ из набора, [a-z] диапазон, {6,} не меньше 6 раз, {3} ровно 3, + один и больше. Скобки в регулярке служебные, поэтому перед ними ставим обратный слеш.', L:[
 [r`if (!preg_match('/^[a-zA-Z0-9]{6,}$/', $login)) $errors[] = 'Логин';`,`{6,}`,`Логин: латиница и цифры, шесть символов и больше.`],
 [r`if (!preg_match('/^[А-Яа-яЁё ]+$/u', $fullname)) $errors[] = 'ФИО';`,`/u`,`Кириллица и пробел. Ё пишем отдельно: она вне диапазона А-я. /u нужен для UTF-8.`],
 [r`if (!preg_match('/^8\([0-9]{3}\)[0-9]{3}-[0-9]{2}-[0-9]{2}$/', $phone)) $errors[] = 'Телефон';`,r`\([0-9]{3}\)`,`Формат 8(999)123-45-67. Слеш перед скобками делает их обычными символами.`],
 [`if (!filter_var($email, FILTER_VALIDATE_EMAIL)) $errors[] = 'E-mail';`,`FILTER_VALIDATE_EMAIL`,`Для почты регулярка не нужна, есть готовый фильтр.`],
 [`if (mb_strlen($password) < 8) $errors[] = 'Пароль';`,`< 8`,`Длину пароля проверяют без регулярки.`]]}
];

const st = {ls:0, v:0, sg:0, i:0, h:0, hint:false};
const STG = ['1 Читаю','2 Пропуск','3 Строка','4 Память'];
const sub = s => (s || '').replace(/@(\w)@/g, (m, k) => VAR[st.v][k] || m);
const norm = s => s.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const getL = () => LS[st.ls].L.map(a => a.map(sub));
const skip = a => st.sg == 1 ? !a[1] : /^\}( else \{)?$/.test(a[0]);

function indents(lines){
  let d = 0;
  return lines.map(l => {
    const b = Math.max(0, d - (/^[}\]]/.test(l) ? 1 : 0));
    d += (l.match(/[{\[]/g) || []).length - (l.match(/[}\]]/g) || []).length;
    return b;
  });
}

function render(){
  const L = getL(), pad = indents(L.map(a => a[0]));
  const sh = i => '  '.repeat(pad[i]) + L[i][0];
  $('#tabs').innerHTML = STG.map((t, i) => `<button data-s="${i}" class="${i == st.sg ? 'on' : ''}">${t}</button>`).join('');
  let h = '';
  if (!st.sg) {
    const info = LS[st.ls].info;
    h = (info ? `<div class="card x">${esc(info)}</div>` : '')
      + L.map((a, i) => `<div class="ln"><code>${esc(sh(i))}</code>${a[2] ? `<div class="x">${esc(a[2])}</div>` : ''}</div>`).join('')
      + `<div class="act"><button class="main" data-s="1" style="width:100%">Дальше: пропуски</button></div>`;
  } else {
    while (st.i < L.length && skip(L[st.i])) st.i++;
    h = `<div class="card"><div class="x">Строка ${Math.min(st.i + 1, L.length)} из ${L.length} · подсказок: ${st.h}</div>`
      + L.slice(0, st.i).map((a, i) => `<div class="l">${esc(sh(i))}</div>`).join('');
    if (st.i >= L.length) {
      h += `<p class="done">✓ Этап пройден</p></div><div class="row">`
        + (st.sg < 3 ? `<button class="main" data-s="${st.sg + 1}">Следующий этап</button>` : '')
        + (st.ls < LS.length - 1 ? `<button data-n="1">Следующий урок</button>` : '') + `</div>`;
    } else {
      const a = L[st.i], t = st.sg == 1 ? a[1] : a[0];
      const code = st.sg == 1 ? a[0].replace(a[1], '▢▢▢') : st.sg == 2 ? '░'.repeat(Math.min(a[0].length, 30)) : '';
      h += (code ? `<div class="l cur">${esc(code)}</div>` : '')
        + (st.sg < 3 && a[2] ? `<div class="x">${esc(a[2])}</div>` : '')
        + (st.hint ? `<div class="l cur">${esc(t)}</div>` : '')
        + `</div><div class="act"><input id="inp" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${st.sg == 1 ? 'Что пропущено?' : 'Введите строку'}">`
        + `<div class="sym">` + [...`$()[]{};'">-=?|\\^/:,.!`].map(c => `<button data-c="${esc(c)}">${esc(c)}</button>`).join('') + `</div>`
        + `<button id="hn" style="width:100%">Подсказка</button></div>`;
    }
  }
  $('#view').innerHTML = h;
  if (st.sg && $('#inp')) $('#inp').focus({preventScroll:true});
}

function chk(){
  const a = getL()[st.i], inp = $('#inp');
  const v = norm(inp.value), t = norm(st.sg == 1 ? a[1] : a[0]);
  if (v === t) { st.i++; st.hint = false; render(); }
  else inp.classList.toggle('bad', v.length >= t.length);
}

function pick(i){ st.ls = i; st.sg = 0; st.i = 0; st.h = 0; st.hint = false; $('#ls').value = i; render(); }

$('#ls').innerHTML = [...new Set(LS.map(l => l.c))].map(c =>
  `<optgroup label="${c}">` + LS.map((l, i) => l.c == c ? `<option value="${i}">${esc(l.n)}</option>` : '').join('') + `</optgroup>`).join('');
$('#ls').onchange = e => pick(+e.target.value);
$('#gv').onchange = e => { st.v = +e.target.value; pick(st.ls); };

document.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s != null) { st.sg = +b.dataset.s; st.i = 0; st.h = 0; st.hint = false; render(); }
  else if (b.dataset.n) pick(st.ls + 1);
  else if (b.id == 'hn') { const v = $('#inp').value; st.hint = true; st.h++; render(); $('#inp').value = v; }
  else if (b.dataset.c) { const i = $('#inp'); i.setRangeText(b.dataset.c, i.selectionStart, i.selectionEnd, 'end'); i.focus(); chk(); }
};
$('#view').oninput = e => { if (e.target.id == 'inp') chk(); };
$('#view').onpaste = e => e.preventDefault();

pick(0);
</script></body></html>
